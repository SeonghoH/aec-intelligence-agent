name: Daily AEC Intelligence Briefing

on:
  schedule:
    # 08:00 Asia/Seoul == 23:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests

      - name: Generate daily briefing
        env:
          # Optional. If any of these is empty, the Notion upload step is
          # skipped silently and only the Markdown briefing is produced.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          NOTION_RESEARCH_DB_ID: ${{ secrets.NOTION_RESEARCH_DB_ID }}
          # Optional LLM summarization. Skipped entirely when LLM_ENABLED
          # is missing/false or the provider's API key is unset.
          LLM_ENABLED: ${{ secrets.LLM_ENABLED }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MAX_ITEMS: ${{ secrets.LLM_MAX_ITEMS }}
          LLM_MIN_SCORE: ${{ secrets.LLM_MIN_SCORE }}
          LLM_MAX_CHARS: ${{ secrets.LLM_MAX_CHARS }}
          LLM_DAILY_PICK_ENABLED: ${{ secrets.LLM_DAILY_PICK_ENABLED }}
          LLM_DAILY_PICK_MIN_ITEMS: ${{ secrets.LLM_DAILY_PICK_MIN_ITEMS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Unpaywall identification email (free, no key). If unset, a
          # generic placeholder is used; the API will still respond.
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          # Elsevier ScienceDirect TDM API key. When present, the pipeline
          # fetches full text for paywalled 10.1016/* DOIs directly.
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: python -m aec_intel_agent.main

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-${{ github.run_id }}
          path: outputs/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated briefing
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add outputs/*.md data/seen_items.json || true
          if git diff --cached --quiet; then
            echo "No briefing changes to commit."
          else
            # Use Asia/Seoul date so the commit message matches the briefing
            # filename (Python code is also pinned to KST). The runner is UTC.
            git commit -m "chore: add daily briefing $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
